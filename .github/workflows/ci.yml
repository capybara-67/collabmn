name: Build iOS demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build
      - run: swiftc CollabMN/Models.swift CollabMN/DataStore.swift tests/main.swift -o build/model-tests
      - run: build/model-tests
      - run: xcodebuild -project CollabMN.xcodeproj -scheme CollabMN -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
